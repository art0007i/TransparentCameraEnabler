# This file is used by the Thunderstore CLI to build and publish your mod to Thunderstore. https://github.com/thunderstore-io/thunderstore-cli

[config]
schemaVersion = "0.0.1"

[package]
namespace = "art0007i"
name = "TransparentCameraEnabler"
description = "Allows you to record transparent videos in Resonite using obs."
websiteUrl = "https://github.com/art0007i/TransparentCameraEnabler"
containsNsfwContent = false

[package.dependencies] 
ResoniteModding-BepisLoader = "1.4.1"
ResoniteModding-RenderiteHook = "1.1.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./RendererPlugin/bin/Release/TransparentCameraEnabler.dll"
target = "Renderer/BepInEx/plugins/TransparentCameraEnabler/"

[[build.copy]]
source = "./RendererPlugin/bin/Release/TransparentCameraEnabler.pdb"
target = "Renderer/BepInEx/plugins/TransparentCameraEnabler/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "./LICENSE"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = [ "mods", "visualtweaks" ] # TODO: Change this to your mod's categories, see https://thunderstore.io/api/experimental/community/resonite/category/ for a list of available categories
